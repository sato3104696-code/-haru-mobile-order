<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11110f"><title>晴｜注文管理</title>
<style>
:root{--bg:#11110f;--card:#1b1b18;--line:#34342e;--text:#f5f1e7;--muted:#aaa596;--gold:#d8b36a;--gold2:#f1d28e;--danger:#e08478;--ok:#79bd84}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px 14px 80px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding:12px 0 16px}.brand{font-family:serif;font-size:36px;letter-spacing:.18em}.sub,.small{font-size:11px;color:var(--muted)}.meta{color:var(--gold2);font-size:13px}.login{max-width:420px;margin:60px auto;background:var(--card);padding:22px;border:1px solid var(--line);border-radius:18px}input{width:100%;font-size:22px;text-align:center;background:#11110f;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.primary,.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800}.primary{width:100%;background:var(--gold);color:#1c180f}.tabs{display:flex;gap:7px;overflow:auto;padding:16px 0 8px}.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:9px 12px}.tab.on{background:var(--gold);color:#1c180f}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.ghost{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:9px 11px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card,.row{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}.head,.between{display:flex;justify-content:space-between;gap:10px;align-items:start}.table{font-size:19px;font-weight:800}.time,.muted{font-size:12px;color:var(--muted)}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#292820;color:var(--gold2)}.item{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-top:12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.actions button{border:1px solid var(--line);background:#22221e;color:var(--text);padding:9px 4px;border-radius:9px;font-weight:700}.actions .danger{color:#ffb0a6}.list{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.rowName{font-weight:800}.switch{min-width:88px}.onbtn{background:var(--ok);color:#0d170f}.offbtn{background:#393832;color:var(--text)}.sold{background:var(--danger);color:#21100d}.category{font-weight:800;color:var(--gold2);margin:17px 2px 7px}.empty{text-align:center;color:var(--muted);padding:50px}.note{font-size:12px;color:var(--muted);margin-top:7px}.bigTotal{font-size:22px;font-weight:900;color:var(--gold2)}@media(max-width:560px){.actions{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div><div class="brand">晴</div><div class="sub">ORDER DESK</div></div><div id="meta" class="meta">注文管理</div></header><div id="app"></div></div>
<script>
const S='https://ickhawaosoangozvmbbd.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlja2hhd2Fvc29hbmdvenZtYmJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODMyNzgsImV4cCI6MjEwNDQ1OTI3OH0.SP-bTOyMICqIdB-A3Z7hSh4Pw_URurlwEzEhGI8h9Z4';
let pin=sessionStorage.getItem('haru_staff_pin')||'',tab='orders',timer=null,lastIds=new Set(),initialized=false,audioCtx=null,sound=false;
const lab={pending:'受付済み',accepted:'確認済み',preparing:'調理中',served:'提供済み',cancelled:'キャンセル'},yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(n,b){let r=await fetch(S+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b)}),j=null;try{j=await r.json()}catch{}if(!r.ok)throw Error(j?.message||'error');return j}
function login(){app.innerHTML='<div class="login"><h2>スタッフログイン</h2><input id="p" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="primary" id="go">開く</button><div id="err"></div></div>';go.onclick=async()=>{pin=p.value.trim();try{await rpc('staff_list_orders',{p_pin:pin});sessionStorage.setItem('haru_staff_pin',pin);show()}catch{err.textContent='PINが違います'}}}
function shell(){app.innerHTML='<div class="tabs">'+[['orders','注文'],['tables','席・会計'],['menu','売り切れ'],['history','履歴']].map(x=>`<button class="tab ${tab==x[0]?'on':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')+'</div><div class="tools"><button class="ghost" id="reload">更新</button><button class="ghost" id="sound">🔕 通知音</button><button class="ghost" id="logout">ログアウト</button></div><div id="view"></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;shell();load()});reload.onclick=load;sound.onclick=enableSound;logout.onclick=()=>{sessionStorage.clear();clearInterval(timer);pin='';login()}}
async function enableSound(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();sound=!sound;document.getElementById('sound').textContent=sound?'🔔 通知音 ON':'🔕 通知音';if(sound)beep()}
function beep(){if(!sound||!audioCtx)return;[880,1046,1318].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.2;o.frequency.value=f;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.16)})}
async function status(id,s){if(s==='cancelled'&&!confirm('この注文をキャンセルしますか？'))return;await rpc('staff_update_order_status',{p_pin:pin,p_order_id:id,p_status:s});load()}
function orderCards(a,history=false){if(!a.length)return '<div class="empty">注文はありません。</div>';return '<div class="grid">'+a.map((o,i)=>`<div class="card"><div class="head"><div><div class="table">${esc(o.table_name)} ${!history&&i===0?'<span class="badge">最新</span>':''}</div><div class="time">${new Date(o.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div><span class="badge">${lab[o.status]||o.status}</span></div>${(o.items||[]).map(x=>`<div class="item"><span>${esc(x.item_name)} × ${x.quantity}</span><b>${yen(x.unit_price*x.quantity)}</b></div>`).join('')}${o.note?`<div class="note">伝言：${esc(o.note)}</div>`:''}<div class="total"><span>合計</span><span>${yen(o.total_amount)}</span></div>${history?'':`<div class="actions"><button onclick="status('${o.id}','accepted')">確認済み</button><button onclick="status('${o.id}','preparing')">調理中</button><button onclick="status('${o.id}','served')">提供済み</button><button class="danger" onclick="status('${o.id}','cancelled')">キャンセル</button></div>`}</div>`).join('')+'</div>'}
async function orders(){let a=await rpc('staff_list_orders',{p_pin:pin});let fresh=initialized?a.filter(o=>o.status==='pending'&&!lastIds.has(o.id)):[];if(fresh.length)beep();lastIds=new Set(a.map(o=>o.id));initialized=true;meta.textContent='未完了 '+a.length+'件';view.innerHTML=orderCards(a)}
async function tables(){let a=await rpc('staff_list_dining_tables',{p_pin:pin}),tot=await rpc('staff_table_totals',{p_pin:pin}),m=new Map(tot.map(x=>[x.id,x]));view.innerHTML='<div class="tools"><button class="primary" style="width:auto" id="alloff">全席 受付停止</button></div><div class="list">'+a.map(t=>{let x=m.get(t.id)||{};return `<div class="row"><div><div class="rowName">${esc(t.name)}</div><div class="muted">注文 ${x.order_count||0}件</div><div class="bigTotal">${yen(x.total_amount)}</div></div><button class="btn switch ${t.is_active?'onbtn':'offbtn'}" data-t="${t.id}" data-a="${t.is_active}">${t.is_active?'受付中':'受付開始'}</button></div>`}).join('')+'</div>';document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{let on=b.dataset.a==='true';if(on&&!confirm('受付を終了しますか？'))return;await rpc('staff_set_dining_table_active',{p_pin:pin,p_table_id:b.dataset.t,p_is_active:!on});tables()});alloff.onclick=async()=>{if(!confirm('全席の注文受付を停止しますか？'))return;await rpc('staff_set_all_tables_active',{p_pin:pin,p_is_active:false});tables()}}
async function menu(){let a=await rpc('staff_list_menu_items',{p_pin:pin}),groups={};a.forEach(x=>(groups[x.category]??=[]).push(x));view.innerHTML=Object.entries(groups).map(([c,items])=>`<div class="category">${esc(c)}</div><div class="list">${items.map(x=>`<div class="row"><div><div class="rowName">${esc(x.name)}</div><div class="muted">${yen(x.price)}</div></div><button class="btn switch ${x.is_available?'onbtn':'sold'}" data-m="${x.id}" data-av="${x.is_available}">${x.is_available?'販売中':'売り切れ'}</button></div>`).join('')}</div>`).join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{let on=b.dataset.av==='true';await rpc('staff_set_menu_item_available',{p_pin:pin,p_menu_item_id:b.dataset.m,p_is_available:!on});menu()})}
async function history(){let a=await rpc('staff_list_order_history',{p_pin:pin,p_limit:100});meta.textContent='注文履歴';view.innerHTML=orderCards(a,true)}
async function load(){try{if(tab==='orders')await orders();else if(tab==='tables')await tables();else if(tab==='menu')await menu();else await history()}catch(e){console.error(e)}}
function show(){shell();load();clearInterval(timer);timer=setInterval(()=>{if(tab==='orders')orders()},5000)}
pin?show():login();
</script></body></html>
