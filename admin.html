<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11110f"><title>晴｜注文管理</title><style>
:root{--bg:#11110f;--card:#1b1b18;--line:#34342e;--text:#f5f1e7;--muted:#aaa596;--gold:#d8b36a;--gold2:#f1d28e;--ok:#7fc48a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px 16px 80px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding:14px 0 18px}.brand{font-family:serif;font-size:38px;letter-spacing:.18em}.sub,.muted{font-size:11px;color:var(--muted)}.meta{font-size:13px;color:var(--gold2)}.login{max-width:420px;margin:70px auto;background:var(--card);padding:22px;border-radius:18px;border:1px solid var(--line)}input{width:100%;font-size:22px;text-align:center;background:#11110f;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.primary,.ghost,.toggle,.actions button{font:inherit;border-radius:10px;padding:11px 12px}.primary{width:100%;border:0;background:var(--gold);font-weight:800}.ghost{border:1px solid var(--line);background:transparent;color:var(--text)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.section{margin:18px 0 24px}.section h3{color:var(--gold2);margin:0 0 10px}.tableGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.seat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}.seat strong{display:block}.toggle{border:0;font-weight:800;min-width:92px}.toggle.on{background:var(--ok);color:#0f1a11}.toggle.off{background:#3a3934;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.head,.item,.total{display:flex;justify-content:space-between;gap:12px}.table{font-size:20px;font-weight:800}.time,.note{font-size:12px;color:var(--muted)}.item{padding:8px 0;border-bottom:1px solid var(--line)}.items{margin:14px 0}.total{font-size:18px;font-weight:800}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.actions button{border:1px solid var(--line);background:#22221e;color:var(--text);font-weight:700}.actions button.active{background:var(--gold);color:#1c180f}.empty{text-align:center;color:var(--muted);padding:40px 0}@media(max-width:520px){.tableGrid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><header><div><div class="brand">晴</div><div class="sub">ORDER DESK</div></div><div class="meta" id="meta">注文管理</div></header><div id="app"></div></div><script>
const S='https://ickhawaosoangozvmbbd.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlja2hhd2Fvc29hbmdvenZtYmJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODMyNzgsImV4cCI6MjEwNDQ1OTI3OH0.SP-bTOyMICqIdB-A3Z7hSh4Pw_URurlwEzEhGI8h9Z4';let pin=sessionStorage.getItem('haru_staff_pin')||'',timer=null;const yen=n=>'¥'+Number(n).toLocaleString('ja-JP'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(n,b){const r=await fetch(S+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b)});let j=null;try{j=await r.json()}catch{}if(!r.ok)throw Error(j?.message||'error');return j}
function login(){app.innerHTML='<div class="login"><h2>スタッフログイン</h2><input id="p" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="primary" id="go">開く</button><div id="e"></div></div>';go.onclick=async()=>{pin=p.value.trim();try{await rpc('staff_list_orders',{p_pin:pin});sessionStorage.setItem('haru_staff_pin',pin);show()}catch{e.textContent='PINが違います'}}}
async function seats(){const a=await rpc('staff_list_dining_tables',{p_pin:pin});tableList.innerHTML=a.map(t=>'<div class="seat"><div><strong>'+esc(t.name)+'</strong><span class="muted">'+(t.is_active?'注文受付中':'受付停止中')+'</span></div><button class="toggle '+(t.is_active?'on':'off')+'" data-id="'+t.id+'" data-on="'+t.is_active+'">'+(t.is_active?'受付中':'受付開始')+'</button></div>').join('');tableList.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const on=b.dataset.on==='true';if(!confirm(on?'この席の注文受付を終了しますか？':'この席の注文受付を開始しますか？'))return;await rpc('staff_set_dining_table_active',{p_pin:pin,p_table_id:b.dataset.id,p_is_active:!on});seats()})}
async function status(id,s){await rpc('staff_update_order_status',{p_pin:pin,p_order_id:id,p_status:s});load()}
async function load(){try{const o=await rpc('staff_list_orders',{p_pin:pin});meta.textContent='未完了 '+o.length+'件';list.innerHTML=o.length?o.map(x=>'<article class="card"><div class="head"><div><div class="table">'+esc(x.table_name)+'</div><div class="time">'+new Date(x.created_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'</div></div><div>'+esc(x.status)+'</div></div><div class="items">'+(x.items||[]).map(i=>'<div class="item"><span>'+esc(i.item_name)+' × '+i.quantity+'</span><strong>'+yen(i.unit_price*i.quantity)+'</strong></div>').join('')+'</div>'+(x.note?'<div class="note">伝言：'+esc(x.note)+'</div>':'')+'<div class="total"><span>合計</span><span>'+yen(x.total_amount)+'</span></div><div class="actions"><button data-i="'+x.id+'" data-s="accepted">確認済み</button><button data-i="'+x.id+'" data-s="preparing">調理中</button><button data-i="'+x.id+'" data-s="served">提供済み</button></div></article>').join(''):'<div class="empty">現在の注文はありません。</div>';list.querySelectorAll('button').forEach(b=>b.onclick=()=>status(b.dataset.i,b.dataset.s));await seats()}catch{sessionStorage.removeItem('haru_staff_pin');clearInterval(timer);login()}}
function show(){app.innerHTML='<div class="toolbar"><button class="ghost" id="reload">更新</button><button class="ghost" id="logout">ログアウト</button></div><section class="section"><h3>席の注文受付</h3><div class="tableGrid" id="tableList"></div><div class="muted" style="margin-top:8px">会計後に「受付中」を押して停止 → 次のお客さんが来たら「受付開始」。QRはずっと同じでOK。</div></section><section class="section"><h3>現在の注文</h3><div class="grid" id="list"></div></section>';reload.onclick=load;logout.onclick=()=>{sessionStorage.removeItem('haru_staff_pin');pin='';clearInterval(timer);login()};load();timer=setInterval(load,5000)}pin?show():login();
</script></body></html>
