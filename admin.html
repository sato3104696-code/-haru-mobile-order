<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11110f"><title>晴｜注文管理</title><style>
:root{--bg:#11110f;--card:#1b1b18;--line:#34342e;--text:#f5f1e7;--muted:#aaa596;--gold:#d8b36a;--gold2:#f1d28e;--warn:#e5b55d;--danger:#e08478}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh}.wrap{max-width:900px;margin:auto;padding:20px 16px 80px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding:14px 0 18px}.brand{font-family:serif;font-size:38px;letter-spacing:.18em}.sub{font-size:11px;color:var(--muted);letter-spacing:.18em}.meta{font-size:13px;color:var(--gold2);text-align:right}.login{max-width:420px;margin:70px auto;background:var(--card);padding:22px;border-radius:18px;border:1px solid var(--line)}input{width:100%;font:inherit;font-size:22px;letter-spacing:.2em;text-align:center;background:#11110f;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.primary{width:100%;border:0;border-radius:12px;background:var(--gold);color:#1c180f;padding:14px;font-weight:800;font-size:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}.ghost{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:start}.table{font-size:20px;font-weight:800}.time{font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:12px;background:#26261f;color:var(--gold2)}.items{margin:14px 0}.item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.note{font-size:12px;color:var(--muted);margin-top:8px}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-top:14px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.actions button{border:1px solid var(--line);background:#22221e;color:var(--text);padding:11px 8px;border-radius:10px;font-weight:700}.actions button.active{background:var(--gold);color:#1c180f;border-color:var(--gold)}.empty{text-align:center;color:var(--muted);padding:70px 0}.err{color:var(--danger);font-size:13px}.new{box-shadow:0 0 0 2px var(--warn) inset}@media(max-width:520px){.actions{grid-template-columns:1fr 1fr}.brand{font-size:32px}}
</style></head><body><div class="wrap"><header><div><div class="brand">晴</div><div class="sub">ORDER DESK</div></div><div class="meta" id="meta">注文管理</div></header><div id="app"></div></div><script>
const SUPABASE='https://ickhawaosoangozvmbbd.supabase.co';const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlja2hhd2Fvc29hbmdvenZtYmJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODMyNzgsImV4cCI6MjEwNDQ1OTI3OH0.SP-bTOyMICqIdB-A3Z7hSh4Pw_URurlwEzEhGI8h9Z4';let pin=sessionStorage.getItem('haru_staff_pin')||'';let lastIds=new Set();let timer=null;const labels={pending:'受付済み',accepted:'確認済み',preparing:'調理中',served:'提供済み',cancelled:'キャンセル'};const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function rpc(name,body){const r=await fetch(SUPABASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:ANON_KEY,Authorization:'Bearer '+ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});let j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j?.message||'request_failed');return j}
function login(){document.getElementById('app').innerHTML='<div class="login"><h2>スタッフログイン</h2><p style="color:var(--muted)">PINを入力してください</p><input id="pin" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="primary" id="go">開く</button><div class="err" id="err"></div></div>';document.getElementById('go').onclick=async()=>{pin=document.getElementById('pin').value.trim();try{await rpc('staff_list_orders',{p_pin:pin});sessionStorage.setItem('haru_staff_pin',pin);show()}catch(e){document.getElementById('err').textContent='PINが違います'}}}
function fmt(t){return new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
async function update(id,status){try{await rpc('staff_update_order_status',{p_pin:pin,p_order_id:id,p_status:status});await load()}catch(e){alert('更新できませんでした')}}
function render(orders){const active=orders.filter(o=>o.status!=='served'&&o.status!=='cancelled');document.getElementById('meta').textContent='未完了 '+active.length+'件';if(!orders.length){document.getElementById('list').innerHTML='<div class="empty">現在の注文はありません。</div>';return}document.getElementById('list').innerHTML=orders.map(o=>{const isNew=!lastIds.has(o.id)&&o.status==='pending';return '<article class="card '+(isNew?'new':'')+'"><div class="head"><div><div class="table">'+esc(o.table_name)+'</div><div class="time">'+fmt(o.created_at)+'</div></div><span class="badge">'+(labels[o.status]||o.status)+'</span></div><div class="items">'+(o.items||[]).map(i=>'<div class="item"><span>'+esc(i.item_name)+' × '+i.quantity+'</span><strong>'+yen(i.unit_price*i.quantity)+'</strong></div>').join('')+'</div>'+(o.note?'<div class="note">伝言：'+esc(o.note)+'</div>':'')+'<div class="total"><span>合計</span><span>'+yen(o.total_amount)+'</span></div><div class="actions"><button data-id="'+o.id+'" data-s="accepted" class="'+(o.status==='accepted'?'active':'')+'">確認済み</button><button data-id="'+o.id+'" data-s="preparing" class="'+(o.status==='preparing'?'active':'')+'">調理中</button><button data-id="'+o.id+'" data-s="served" class="'+(o.status==='served'?'active':'')+'">提供済み</button></div></article>'}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.s));lastIds=new Set(orders.map(o=>o.id))}
async function load(){try{const orders=await rpc('staff_list_orders',{p_pin:pin});render(Array.isArray(orders)?orders:[])}catch(e){sessionStorage.removeItem('haru_staff_pin');clearInterval(timer);login()}}
function show(){document.getElementById('app').innerHTML='<div class="toolbar"><button class="ghost" id="reload">更新</button><button class="ghost" id="logout">ログアウト</button></div><div class="grid" id="list"></div>';document.getElementById('reload').onclick=load;document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('haru_staff_pin');pin='';clearInterval(timer);login()};load();timer=setInterval(load,5000)}
pin?show():login();
</script></body></html>
